
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password | LostLink</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="page">
        <div class="card">
            <div class="brand">LostLink ✦</div>
            <p class="subtitle">Secure your campus account</p>

            <h2>Change Password</h2>
            <p>This is your first login. Please create a new password.</p>

            <p class="error" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/change-password}" method="post">
                <label for="currentPassword">Current Password</label>
                <input id="currentPassword" name="currentPassword"
                       type="password" required>

                <label for="newPassword">New Password</label>
                <input id="newPassword" name="newPassword"
                       type="password" minlength="12"
                       autocomplete="new-password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword" name="confirmPassword"
                       type="password" minlength="12"
                       autocomplete="new-password" required>

                <button type="submit">Update Password</button>
            </form>
        </div>
    </main>
</body>
</html>
